# Render Blueprint — Kabadiwala Connect (SIH26229)
#
# ONE service serves BOTH the built frontend and the API from the same origin.
# No CORS, no build-time API URL, nothing that can drift apart. The previous
# two-service setup caused "backend and frontend not in sync": the frontend
# baked in an API URL whose name was taken by a different project, and the
# two services could deploy different code versions independently.
#
# Deploy: Render Dashboard → New + → Blueprint → repo arbab-25/FALTU → Connect.
# Paste your Neon connection string when prompted for DATABASE_URL.
#
# After deploy, ONE URL does everything:
#   https://faltu-sih26229.onrender.com/            → the app
#   https://faltu-sih26229.onrender.com/api/health  → diagnostic fingerprint

services:
  - type: web
    name: faltu-sih26229
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt
      (npm install --prefix frontend && npm run build --prefix frontend) || echo "Node unavailable — serving the committed frontend/dist bundle"
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string (the -pooler one)
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_NAME
        value: Kabadiwala Connect
      - key: NODE_VERSION
        value: "20"
