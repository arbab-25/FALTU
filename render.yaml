# Render Blueprint — Kabadiwala Connect (SIH26229)
#
# Provisions:
#   1. kabadiwala-api   FastAPI backend (Python)
#   2. kabadiwala-web   React static site (Vite build)
#   3. DATABASE_URL     your Neon Postgres connection string (sync: false)
#
# Deploy: Render Dashboard → New + → Blueprint → pick this repo.
# Paste your Neon connection string when prompted for DATABASE_URL.
# (Neon → Dashboard → Connection string → Prisma/psycopg2 format works.)

services:
  # ---------------- FastAPI backend ----------------
  - type: web
    name: kabadiwala-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r ../requirements.txt psycopg2-binary
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string here
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_NAME
        value: Kabadiwala Connect
    cors:
      allowedOrigins:
        - https://kabadiwala-web.onrender.com
        - http://localhost:5173

  # ---------------- React frontend (static site) ----------------
  - type: web
    name: kabadiwala-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback: every path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kabadiwala-api.onrender.com/api
    envSync: false
